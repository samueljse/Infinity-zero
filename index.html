<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Infinity Zero</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

header {
    background: #1e293b;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: #1e293b;
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
}

img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #38bdf8;
    border: none;
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
}

</style>
</head>

<body>

<header>
<h1>🔥 Infinity Zero</h1>
<p>Tienda de Blox Fruits</p>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/250x150?text=Fruta+Dragon">
<h3>Fruta Dragón</h3>
<p>R$20</p>
<button onclick="comprar('Fruta Dragón')">Comprar</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x150?text=Espada+Legendaria">
<h3>Espada Legendaria</h3>
<p>R$15</p>
<button onclick="comprar('Espada Legendaria')">Comprar</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x150?text=Estilo+de+Pelea">
<h3>Estilo de pelea</h3>
<p>R$10</p>
<button onclick="comprar('Estilo de pelea')">Comprar</button>
</div>

</div>

<script>
function comprar(producto) {
    alert("Quieres comprar: " + producto);
}
</script>

</body>
</html>
